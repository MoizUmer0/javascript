<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoM edit or remove</title>
</head>
<body style="background-color: black; color: white;">
        <ul class="language">
            <li>Javascript</li>

        </ul>
</body>
<script>
    function addlanguage(langName){
       const li= document.createElement('li')
       li.innerHTML = `${langName}`
       document.querySelector('.language').appendChild(li)
    }
    addlanguage('Python')
    addlanguage('TypeScript')


    function addoptilanguage(langName){
        const li= document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addoptilanguage("C++")

    // edit
    const secondlanguage= document.querySelector('li:nth-child(2)')
    console.log(secondlanguage)
    // secondlanguage.innerHTML="Mojo"
    const newli =document.createElement('li')
    newli.textContent='Mojo'
    secondlanguage.replaceWith(newli)


    //edit
    const secondlang1 = document.querySelector("li:first-child")
    secondlang1.outerHTML='<li>TypeScript</li>'


    //remove
    const lastlang= document.querySelector("li:last-child")
    lastlang.remove()

</script>
</html>
